name: Publish n8n-nodes-github-app to npm

on:
  release:
    types: [published]

jobs:
  publish:
    # Only run if the release tag starts with "github-app-v"
    if: startsWith(github.ref, 'refs/tags/github-app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ./packages/n8n-nodes-github-app
        run: npm ci

      - name: Build package
        working-directory: ./packages/n8n-nodes-github-app
        run: npm run build

      - name: Run tests
        working-directory: ./packages/n8n-nodes-github-app
        run: npm test

      - name: Publish to npm
        working-directory: ./packages/n8n-nodes-github-app
        run: npm publish --provenance --access public
